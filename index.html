<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نشرة البلوت</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="نشرة البلوت">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f1e8;--card:#fff;--ink:#17241c;--mut:#6b7a70;--acc:#b8860b;--g:#1f6b45;--g2:#2e8b5b;--line:#e2ded0;--bad:#b3392f;--chip:#e9efe9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1a14;--card:#17271d;--ink:#eef3ee;--mut:#8fa396;--acc:#e0b84a;--g:#2e8b5b;--g2:#3fae75;--line:#26382d;--bad:#e5645a;--chip:#1f3326}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1a14;--card:#17271d;--ink:#eef3ee;--mut:#8fa396;--acc:#e0b84a;--g:#2e8b5b;--g2:#3fae75;--line:#26382d;--bad:#e5645a;--chip:#1f3326}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;min-height:100%}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:24px;margin:0;font-weight:800}h1 span{color:var(--acc)}
.who{font-size:13px;color:var(--mut);background:var(--chip);padding:5px 10px;border-radius:99px;cursor:pointer}
.tabs{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:14px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:700;padding:10px 4px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--g);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:17px}
.btn{border:0;background:var(--g);color:#fff;font:inherit;font-weight:700;padding:12px 16px;border-radius:12px;cursor:pointer;width:100%}
.btn.alt{background:var(--chip);color:var(--ink)}.btn.gold{background:var(--acc);color:#1b1500}.btn.bad{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px}.row>*{flex:1}
select,input{font:inherit;width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.team{border-radius:14px;padding:12px;margin-bottom:10px;border:1px dashed var(--line)}
.team label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px;font-weight:700}
.team select{margin-bottom:6px}
.vs{text-align:center;color:var(--acc);font-weight:800;margin:4px 0}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tm{background:linear-gradient(160deg,var(--g),#164d32);color:#fff;border-radius:18px;padding:14px;text-align:center}
.tm.lead{outline:3px solid var(--acc)}
.tm small{display:block;opacity:.85;font-size:13px;min-height:36px}
.tm b{display:block;font-size:46px;line-height:1.1;margin-top:4px}
.bar{height:6px;background:rgba(255,255,255,.25);border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.rounds{margin:0;padding:0;list-style:none}.rounds li{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line);font-size:15px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.st small{color:var(--mut);display:block;font-size:12px}.st b{font-size:17px;display:block;margin-top:2px}.st em{font-style:normal;color:var(--acc);font-weight:700;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500;font-size:12px}td:first-child,th:first-child{text-align:right}
.scroll{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chips button{border:0;background:var(--chip);color:var(--ink);font:inherit;padding:9px 14px;border-radius:99px;cursor:pointer;font-weight:700}
.note{color:var(--mut);font-size:13px;margin:6px 0}
.empty{text-align:center;color:var(--mut);padding:22px 8px}
.win{color:var(--g2);font-weight:700}
.icons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}.ic{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 2px;font:inherit;cursor:pointer;text-align:center}.ic span{display:block;font-size:24px;line-height:1.3}.ic small{font-size:11px;color:var(--mut)}.ic.on{background:var(--g);border-color:var(--g)}.ic.on small{color:#fff}
.bd{display:flex;gap:14px;justify-content:center}
.cir{width:min(44vw,176px);aspect-ratio:1;border-radius:50%;padding:9px;background:conic-gradient(var(--acc) var(--p),var(--line) 0)}
.cir.lead{box-shadow:0 0 0 3px var(--acc)}
.cir .in{width:100%;height:100%;border-radius:50%;background:var(--g);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px}
.half{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.half.flip{border-top:1px solid rgba(255,255,255,.25)}
.half b{font-size:clamp(30px,10.5vw,46px);line-height:1;font-weight:800}
.cir small{font-size:11px;opacity:.92;line-height:1.3;margin:2px 0}
.flip{transform:rotate(180deg)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tm{background:linear-gradient(160deg,var(--g),#164d32);color:#fff;border-radius:18px;padding:10px;text-align:center}
.tm.lead{outline:3px solid var(--acc)}
.tp{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0}
.tp.flip{transform:rotate(180deg);border-bottom:1px solid rgba(255,255,255,.25)}
.tp small{font-size:12px;opacity:.9;line-height:1.3;min-height:16px}
.tp b{font-size:42px;line-height:1.1;font-weight:800}
.tm .bar{height:6px;background:rgba(255,255,255,.25);border-radius:9px;margin-top:6px;overflow:hidden}.tm .bar i{display:block;height:100%;background:var(--acc)}
.tm{padding:14px}
.tm small{display:block;opacity:.85;font-size:13px;min-height:36px;line-height:1.3}
.tm b{display:block;font-size:46px;line-height:1.1;margin-top:4px;font-weight:800}
.cir b{display:block;font-size:clamp(44px,15vw,68px);line-height:1.05;font-weight:800}
.cir small{display:block;font-size:13px;opacity:.92;line-height:1.3;margin-top:6px;max-width:90%}
/* ===== البطولة ===== */
.tabs button{font-size:14px;padding:10px 2px}
.chips button.on{background:var(--g);color:#fff}
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#2e8b5b,#123d27);color:#fff;border-radius:20px;padding:18px 14px;margin-bottom:12px;text-align:center;animation:glow 2.2s infinite}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(224,184,74,.55)}70%{box-shadow:0 0 0 12px rgba(224,184,74,0)}100%{box-shadow:0 0 0 0 rgba(224,184,74,0)}}
.hero .tag{display:inline-block;background:#e0b84a;color:#1b1500;font-weight:800;font-size:12px;padding:4px 12px;border-radius:99px}
.hero .rnd{font-size:19px;font-weight:800;margin:8px 0 14px}
.duel{display:flex;align-items:center;gap:8px}
.duel .side{flex:1;min-width:0}
.duel .nm{font-size:18px;font-weight:800}
.duel .ps{font-size:13px;opacity:.85;margin-top:3px}
.duel .x{font-size:28px;font-weight:800;color:#e0b84a;text-shadow:0 0 12px rgba(224,184,74,.6);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.hero .note{color:#fff;opacity:.8}
.rh{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;font-weight:800;font-size:15px;color:var(--acc)}
.rh:after{content:"";flex:1;height:1px;background:var(--line)}
.mc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.mc.nx{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.mc .mh{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);padding:6px 12px 0}
.mt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;width:100%;border:0;background:none;color:var(--ink);font:inherit;text-align:right}
button.mt{cursor:pointer}
.mt+.mt{border-top:1px dashed var(--line)}
.mt .tn2{font-weight:700}.mt .tp2{display:block;font-size:12px;color:var(--mut)}
.mt.w{background:rgba(224,184,74,.15)}.mt.w .tn2:after{content:" ✓";color:var(--acc)}
.mt.l{opacity:.45}.mt.l .tn2{text-decoration:line-through}
.mt.tbd .tn2{color:var(--mut);font-weight:400}
.mt b{font-size:16px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.tc.pop{animation:pop .5s ease}
.tc .tn3{font-weight:800;font-size:15px;margin-bottom:4px}
.tc button{display:block;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;padding:7px;border-radius:10px;margin-top:5px;cursor:pointer}
.tc button:disabled{cursor:default}
.tc button.sw{background:var(--acc);color:#1b1500;border-color:var(--acc)}
.tc.hid{opacity:.45}.tc.hid .tn3{font-size:30px}
.tc.spin{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.tc .sp{font-weight:700;font-size:14px;min-height:44px;display:flex;align-items:center;justify-content:center}
@keyframes pop{0%{transform:scale(.6) rotateY(90deg);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}
.champ{text-align:center;background:linear-gradient(160deg,#e0b84a,#b8860b);color:#1b1500;border-radius:20px;padding:22px 14px;margin-bottom:12px;animation:pop .6s ease}
.champ .cup{font-size:60px;line-height:1}
.champ .nm{font-size:25px;font-weight:800;margin-top:6px}
.tbanner{background:var(--chip);border-radius:12px;padding:8px 12px;text-align:center;font-weight:700;font-size:14px;margin-bottom:12px}
/* ===== الإحصائيات الجديدة ===== */
.xhero{border-radius:20px;padding:12px;color:#fbf3e3;background:linear-gradient(160deg,#8a5a33,#4e2d17 60%,#3f2410);box-shadow:0 10px 22px rgba(50,25,5,.22);margin-bottom:10px}
.xsadu{height:8px;border-radius:5px;margin-bottom:10px;background:linear-gradient(135deg,#9b2d1f 25%,transparent 25%) -7px 0/14px 8px,linear-gradient(225deg,#9b2d1f 25%,transparent 25%) -7px 0/14px 8px,linear-gradient(315deg,#231a12 25%,transparent 25%) 0 0/14px 8px,linear-gradient(45deg,#231a12 25%,transparent 25%) 0 0/14px 8px,#efe3cf}
.xseg{display:flex;background:rgba(0,0,0,.25);border-radius:14px;padding:4px}
.xseg button{flex:1;border:0;background:none;color:#f1e4c8;font:inherit;font-weight:800;font-size:14px;padding:10px 4px;border-radius:11px;cursor:pointer}
.xcnt{display:inline-block;min-width:20px;font-size:11px;background:rgba(0,0,0,.18);border-radius:99px;padding:1px 6px;margin-right:3px}
.xseg button.on{background:#fbf3e3;color:#4a2c14;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.xsrc{font-size:12.5px;margin-top:9px;opacity:.9;text-align:center}
.xtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.xtabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:12.5px;padding:8px 2px;border-radius:14px;cursor:pointer}
.xtabs button span{display:block;font-size:20px;line-height:1.3}
.xtabs button.on{background:var(--g);border-color:var(--g);color:#fff}
.xper{margin-bottom:10px;font-weight:700}
.xsec{display:flex;align-items:center;gap:8px;margin:22px 2px 10px;font-weight:800;font-size:16.5px;color:var(--acc)}
.xsec:after{content:"";flex:1;height:1px;background:var(--line)}
.xsec small{order:2;font-size:11px;font-weight:700;background:var(--chip);color:var(--mut);border-radius:99px;padding:3px 8px}
.xpad{margin:-4px 6px 0}
.xav{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:16px;color:#4a2c14;background:linear-gradient(#fbf3e3,#e3cca5);border:2px solid #c9a46a;flex:0 0 auto}
.xtiles{display:grid;gap:8px;margin-bottom:12px}
.xtile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center}
.xtile b{display:block;font-size:24px;line-height:1.15;color:var(--acc)}.xtile small{font-size:12px;color:var(--mut)}
.xtile.xbig{text-align:right;padding:10px 12px}.xtile.xbig b{font-size:21px}.xtile.xbig span{font-size:12px;color:var(--mut)}
.xnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.xnav button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:24px;font-weight:800;cursor:pointer}
.xnav button:disabled{opacity:.3}
.xnav div{flex:1;text-align:center}.xnav b{display:block;font-size:16px}.xnav small{color:var(--mut);font-size:12px}
.xstar{display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px 14px;margin-bottom:4px;color:#fbf3e3;background:radial-gradient(120% 120% at 90% 0,#2a8a64,#0d3527 75%);box-shadow:0 8px 18px rgba(0,0,0,.18)}
.xstar .xav{width:54px;height:54px;font-size:24px;border:3px solid #e0b84a}
.xstar small{display:block;color:#e0b84a;font-weight:800}.xstar b{display:block;font-size:20px}.xstar span{font-size:12.5px;opacity:.85}
.xlad{position:relative}
.xlad:before{content:"";position:absolute;right:17px;top:18px;bottom:18px;width:4px;border-radius:4px;background:linear-gradient(#e0b84a,#8a5a33 55%,#9b2d1f)}
.xlv{position:relative;display:flex;gap:10px;align-items:center;padding:5px 0}
.xic{position:relative;z-index:1;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--card);border:3px solid var(--c);flex:0 0 auto}
.xbd{flex:1;min-width:0;border-radius:14px;padding:7px 10px;background:color-mix(in srgb,var(--c) 10%,var(--card));border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.xt{display:flex;justify-content:space-between;align-items:baseline;gap:6px}.xt b{font-size:14.5px}.xt span{font-size:11.5px;color:var(--mut);white-space:nowrap}
.xps{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.xps em{font-style:normal;font-size:12.5px;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 9px 2px 3px;display:inline-flex;align-items:center;gap:5px}
.xps em .xav{width:20px;height:20px;font-size:10px;border-width:1px}.xps em small{color:var(--mut)}
.xno{font-size:12px;color:var(--mut)}
.xlist{padding:4px 10px}
.xrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.xrow:last-child{border:0}.xclick{cursor:pointer}
.xrk{width:24px;text-align:center;font-weight:800;font-size:15px;color:var(--mut)}
.xmid{flex:1;min-width:0}.xmid b{font-size:15px}
.xtc{display:inline-block;font-size:11px;font-weight:800;border-radius:99px;padding:1px 8px;margin-right:5px;color:#fff;background:var(--c);vertical-align:2px}
.xwl{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:6px;background:var(--chip)}
.xwl i{background:var(--g2)}.xwl u{background:#c96a5e}
.xrt{text-align:left;min-width:64px}.xrt b{display:block;font-size:17px}.xrt small{font-size:11px;color:var(--mut)}
.xg{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.xg:last-child{border:0}.xg .w{font-weight:800;color:var(--g2)}.xg .w.hl{color:var(--acc)}.xg .l{color:var(--mut);text-align:left}.xg b{font-size:15px}
.xcab{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.xcab span{font-size:15px;background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:8px;padding:1px 6px}
.xcab sub{font-size:11px;font-weight:800;vertical-align:0;margin-right:2px}
.xcab.big{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.xcab.big span{text-align:center;font-size:22px;padding:6px 2px;border-radius:12px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.xcab.big span small{display:block;font-size:10.5px;font-weight:700;color:var(--mut)}
.xcab.big span.off{opacity:.35;filter:grayscale(1)}
.xmini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.xmini div{background:var(--chip);border-radius:12px;padding:8px 4px;text-align:center;font-size:11.5px;color:var(--mut)}.xmini b{display:block;font-size:14.5px;color:var(--ink)}
.xchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.xchips button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:13px;padding:7px 13px;border-radius:99px;cursor:pointer}
.xchips button.on{background:var(--acc);border-color:var(--acc);color:#1b1500}
.xpc{position:relative;border-radius:22px;padding:16px;color:#fbf3e3;background:radial-gradient(120% 90% at 80% 0,#2a8a64,#0d3527 70%);overflow:hidden;box-shadow:0 12px 26px rgba(0,0,0,.22)}
.xpc:before{content:"";position:absolute;inset:7px;border:1.5px solid rgba(224,184,74,.5);border-radius:16px;pointer-events:none}
.xtop{display:flex;gap:12px;align-items:center}.xtop .xav{width:64px;height:64px;font-size:28px;border:3px solid #e0b84a}
.xwho{flex:1;min-width:0}.xwho b{display:block;font-size:21px}
.xttl{display:inline-block;margin-top:4px;background:rgba(224,184,74,.2);border:1px solid rgba(224,184,74,.6);border-radius:99px;padding:3px 10px;font-weight:800;font-size:13px}
.xrank{text-align:center}.xrank b{display:block;font-size:26px;color:#e0b84a}.xrank small{font-size:11px;opacity:.8}
.xnx{margin-top:12px;font-size:12.5px}
.xbar{height:9px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:5px}.xbar i{display:block;height:100%;background:linear-gradient(90deg,#8a6420,#e0b84a);border-radius:99px}
.xat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 10px}
.xat div{background:rgba(255,255,255,.08);border-radius:12px;padding:7px 2px;text-align:center}.xat b{display:block;font-size:19px;color:#e0b84a}.xat small{font-size:10.5px;opacity:.85}
.xform{display:flex;gap:5px;justify-content:center;align-items:center;font-size:12px;flex-wrap:wrap}
.xform i{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:11px;color:#fff}
.xform .w{background:#2e8b5b;border:1.5px solid #8fe0b4}.xform .l{background:#9b2d1f;border:1.5px solid #f0a49a}.xform span{margin-right:8px}
.xrel{display:flex;gap:8px;margin-top:10px}.xrel div{flex:1;background:rgba(0,0,0,.2);border-radius:10px;padding:6px 8px;font-size:12px}.xrel b{display:block;font-size:14px}
.xpr{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center;padding:6px 0;font-size:13.5px;font-weight:700}
.xpr span{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}.xpr .xav{width:26px;height:26px;font-size:12px}
.xpr .xwl{margin:0}.xpr b{text-align:left;direction:ltr}
.xsel2{display:flex;gap:8px;align-items:center}.xsel2 select{flex:1;font-weight:700}

.xnm{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.xgrid{display:grid;gap:4px;font-size:11.5px}

.xgrid .xrh{font-weight:800;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.xgrid .cl{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;align-content:center;font-weight:800;font-size:12px;color:#fff;text-align:center;line-height:1.15}
.xgrid .cl small{display:block;font-size:9.5px;opacity:.85;font-weight:500}.xgrid .cl.x{background:var(--chip);color:var(--mut)}
.xleg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;margin-top:6px}.xleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px}

/* دوائر النتيجة: دائرية دائماً وثابتة فوق */
.bd{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);padding:8px 14px 10px;margin:0 -14px;align-items:center;box-shadow:0 8px 12px -10px rgba(0,0,0,.25)}

/* ===== توزيع الفرق ===== */
@keyframes dIn{0%{opacity:0;transform:translateY(18px) scale(.9) rotateX(70deg)}60%{opacity:1;transform:translateY(-3px) scale(1.02) rotateX(0)}100%{opacity:1;transform:none}}
@keyframes dGlow{0%,100%{box-shadow:0 8px 20px rgba(50,25,5,.18)}50%{box-shadow:0 8px 26px rgba(224,184,74,.55)}}

.dh{display:flex;align-items:center;gap:12px}.dic{font-size:34px;line-height:1}
.dh b{display:block;font-size:20px}.dh small{font-size:13px;opacity:.85}
.dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.dtop b{font-size:16px}
.dlink{border:0;background:none;color:var(--acc);font:inherit;font-weight:800;cursor:pointer;padding:2px 4px}
.dchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.dchip{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px 8px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
.dchip span:not(.dav){max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dchip i{position:absolute;top:5px;left:6px;width:20px;height:20px;border-radius:50%;background:var(--g);color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center;opacity:0;transform:scale(.5);transition:.15s}
.dchip.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card));transform:translateY(-2px)}
.dchip.on i{opacity:1;transform:none}
.dchip:not(.on) .dav{filter:grayscale(.7);opacity:.75}
.dav{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;color:#4a2c14;background:linear-gradient(#fbf3e3,#e3cca5);border:2px solid #c9a46a;flex:0 0 auto}
.dbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 10px 26px rgba(0,0,0,.18)}
.dbar>div{flex:1;font-size:14px}.dbar>div b{font-size:24px;color:var(--acc)}.dbar small{display:block;color:var(--mut);font-size:12px}
.dbar .btn{flex:0 0 auto;width:auto;padding:13px 18px}
.dbar .btn:disabled{opacity:.45}
.dmeta{text-align:center;font-size:12.5px;color:var(--mut);margin:-2px 0 10px}
.dteams{display:grid;grid-template-columns:1fr;gap:10px;perspective:800px}
@media (min-width:520px){.dteams{grid-template-columns:1fr 1fr}}
.dteam{position:relative;border-radius:20px;padding:12px 14px 14px;color:#fbf3e3;background:radial-gradient(120% 120% at 85% 0,#2a8a64,#0d3527 75%);opacity:0;animation:dIn .6s cubic-bezier(.2,.8,.3,1.2) forwards,dGlow 2.4s ease-in-out 1;border:1.5px solid rgba(224,184,74,.45)}
.dnum{position:absolute;top:10px;left:12px;width:28px;height:28px;border-radius:50%;background:#e0b84a;color:#2b1a0e;font-weight:800;display:grid;place-items:center;font-size:14px}
.dtn{font-weight:800;font-size:13px;color:#ffd66b;opacity:.85;margin-bottom:10px;padding-right:2px}
.dpair{display:flex;align-items:center;justify-content:space-around;gap:6px}
.dpl{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;flex:1}
.dpl .dav{width:54px;height:54px;font-size:24px;border:3px solid #e0b84a}
.dpl b{font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.damp{font-size:22px;font-weight:800;color:#e0b84a}
.dspare{margin-top:10px;text-align:center;font-size:14px;background:color-mix(in srgb,var(--acc) 12%,var(--card));border:1px dashed var(--acc);border-radius:14px;padding:10px;opacity:0;animation:dIn .5s forwards}
.dact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.dmatch{display:grid;gap:8px}

.dmatch button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:15px;padding:12px 14px;border-radius:14px;cursor:pointer}
.dmatch button em{font-style:normal;font-size:12px;color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);border-radius:99px;padding:2px 10px}
.dmatch button:active{transform:scale(.98)}
.dopen{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:18px;padding:14px;margin-bottom:12px;cursor:pointer;color:#fbf3e3;font:inherit;text-align:right;background:linear-gradient(160deg,#8a5a33,#4e2d17 60%,#3f2410);box-shadow:0 8px 18px rgba(50,25,5,.2)}
.dopen .dic{font-size:30px}.dopen b{display:block;font-size:16px}.dopen small{font-size:12.5px;opacity:.85}.dopen .go{margin-right:auto;font-size:22px;color:#e0b84a}
</style>

</head>
<body>
<div class="wrap">
<header><h1>🃏 أساطير <span>البلوت</span></h1><div class="who" id="who"></div></header>
<div class="tabs" id="tabs"></div>
<main id="main"><div class="empty">جاري التحميل…</div></main>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,user,uid,meDoc,me=null,players=[],games=[],live=null,tab='game',canWrite=true,loaded={p:0,g:0,l:0,m:0,t:0};
let devId='',snd=true,nextSetup=false,editTeams=false,tm=['','','',''];
try{devId=localStorage.getItem('baloot_dev');if(!devId){devId=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('baloot_dev',devId)}}catch(e){devId='tmp'+Math.random()}
try{snd=localStorage.getItem('baloot_snd')!=='0'}catch(e){}
let setup={p:['','','',''],target:152};let period='all',editIdx=-1,sview='wins';
const TABS=[['game','الصكة'],['online','أونلاين'],['tour','البطولة'],['stats','إحصائيات'],['hist','السجل']];

function sums(){const r=(live&&live.rounds)||[];return [r.reduce((s,x)=>s+x.a,0),r.reduce((s,x)=>s+x.b,0)]}
const tn=a=>a.map(esc).join(' و ');

const mkey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+(d.getMonth()+1)};
const fg=()=>period==='all'?[...games]:games.filter(g=>mkey(g.ts)===period);
function filterBar(){
  const ks=[...new Set(games.map(g=>mkey(g.ts)))].sort((a,b)=>{const[x,y]=a.split('-').map(Number),[p,q]=b.split('-').map(Number);return (p*12+q)-(x*12+y)});
  const lbl=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('ar',{month:'long',year:'numeric'})};
  return `<div class="card"><label class="note">الفترة</label><select data-act="period"><option value="all">كل الوقت</option>${ks.map(k=>`<option value="${k}" ${k===period?'selected':''}>${lbl(k)}</option>`).join('')}</select></div>`;
}
function stats(){
  const P={},T={},streak={};let rec=null;
  const gs=fg().sort((x,y)=>x.ts-y.ts);const PR={},RV={};
  const bump=(o,k,w)=>{o[k]=o[k]||{n:0,w:0};o[k].n++;if(w)o[k].w++};
  gs.forEach(g=>{
    const wa=g.winner==='A',A=g.a,B=g.b;
    A.forEach(n=>{bump(P,n,wa);const s=streak[n]=streak[n]||{c:0,m:0};if(wa){s.c++;s.m=Math.max(s.m,s.c)}else s.c=0});
    B.forEach(n=>{bump(P,n,!wa);const s=streak[n]=streak[n]||{c:0,m:0};if(!wa){s.c++;s.m=Math.max(s.m,s.c)}else s.c=0});
    bump(T,[...A].sort().join(' و '),wa);bump(T,[...B].sort().join(' و '),!wa);
    [[A,B,wa],[B,A,!wa]].forEach(([t,o,w])=>{const k=[...t].sort().join(' و '),ok=[...o].sort().join(' و ');t.forEach((n,i)=>{PR[n]=PR[n]||{};bump(PR[n],t[1-i],w)});RV[k]=RV[k]||{};bump(RV[k],ok,w)});
    const d=Math.abs(g.sa-g.sb);if(!rec||d>rec.d)rec={d,g};
  });
  const pl=Object.entries(P).map(([k,v])=>({k,...v,r:v.w/v.n,ms:streak[k].m,cs:streak[k].c}));
  const tl=Object.entries(T).map(([k,v])=>({k,...v,r:v.w/v.n}));
  const bp=Object.entries(PR).map(([k,o])=>{const m=best(Object.entries(o).filter(([,v])=>v.n>=2).map(([p,v])=>({p,...v,r:v.w/v.n})),x=>x.r*100+x.n);return m&&{k,...m}}).filter(Boolean);
  const nm=Object.entries(RV).map(([k,o])=>{const m=best(Object.entries(o).filter(([,v])=>v.n>=2).map(([t,v])=>({t,...v,l:v.n-v.w})),x=>x.l*100+x.n);return m&&m.l>0&&{k,...m}}).filter(Boolean);
  return {pl,tl,rec,bp,nm};
}
const pct=r=>Math.round(r*100)+'%';
const fr=(a,b,s)=>`<span style="display:inline-flex;direction:rtl;gap:4px;justify-content:center"><span>${a}</span><span>${s}</span><span>${b}</span></span>`;
const best=(a,f)=>a.length?a.reduce((m,x)=>f(x)>f(m)?x:m):null;

function render(){
  if(loaded.p+loaded.g+loaded.l+loaded.m+loaded.t<5)return;
  const keep={a:($('#ia')||{}).value,b:($('#ib')||{}).value},ke={a:($('#ea')||{}).value,b:($('#eb')||{}).value};
  $('#who').textContent=me?('👤 '+me):'من أنت؟';
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button data-act="tab" data-v="${k}" class="${tab===k?'on':''}">${l}</button>`).join('');
  const m=$('#main');
  if(!me||tab==='who')m.innerHTML=whoView();
  else if(tab==='game')m.innerHTML=live&&live.active&&!(live.finished&&nextSetup)?liveView():setupView();
  else if(tab==='tour')m.innerHTML=tourView();
  else if(tab==='draw')m.innerHTML=drawView();
  else if(tab==='online')m.innerHTML=window.oView?oView():'<div class="card empty">جاري التحميل…</div>';
  else if(tab==='stats')m.innerHTML=statsView();
  else m.innerHTML=histView();
  if($('#ia')&&keep.a!==undefined){$('#ia').value=keep.a;$('#ib').value=keep.b}
  if($('#ea')&&ke.a!==undefined){$('#ea').value=ke.a;$('#eb').value=ke.b}
}

function whoView(){
  return `<div class="card"><h2>من أنت؟</h2><p class="note">اختر اسمك مرة وحدة وبيتذكره جوالك.</p>
  <div class="chips">${players.map(p=>`<button data-act="setme" data-v="${esc(p)}">${esc(p)}</button>`).join('')||'<span class="note">ما فيه لاعبين بعد، أضف اسمك:</span>'}</div>
  <div class="row"><input id="np" placeholder="اسم جديد"><button class="btn" style="flex:0 0 90px" data-act="addme">إضافة</button></div></div>`;
}

function setupView(){
  const opt=v=>`<option value="">— اختر —</option>`+players.map(p=>`<option ${p===v?'selected':''}>${esc(p)}</option>`).join('');
  if(!setup.pre){
    setup.pre=true;
    const lg=[...games].sort((x,y)=>y.ts-x.ts)[0];
    if(nextSetup&&live&&live.finished){const A=live.win==='A';setup.p=[...(A?live.a:live.b),...(A?live.b:live.a)];setup.cont=true}
    else if(lg){const A=lg.winner==='A';setup.p=[...(A?lg.a:lg.b),...(A?lg.b:lg.a)];setup.cont=true}
    else if(me)setup.p[0]=me;
  }
  const sel=i=>`<select data-act="sel" data-i="${i}">${opt(setup.p[i])}</select>`;
  const nx=nextSetup&&live&&live.finished;
  return `<button class="dopen" data-act="dopen"><span class="dic">🎲</span><span><b>توزيع الفرق</b><small>${D&&D.teams&&Date.now()-D.ts<12*3600e3?'آخر قرعة: '+D.teams.length+' فرق، اضغط تشوفها':'اختر الحاضرين ونوزعكم كل اثنين مع بعض'}</small></span><span class="go">‹</span></button><div class="card"><h2>صكة جديدة</h2>${setup.cont?'<p class="note">الفريق الفايز مستمر، غيّر المتحدين لو تبغى</p>':''}
  <div class="team"><label>${setup.cont?'الفريق الفايز (مستمر)':'الفريق الأول'}</label>${sel(0)}${sel(1)}</div>
  <div class="vs">ضد</div>
  <div class="team"><label>${setup.cont?'الفريق المتحدي':'الفريق الثاني'}</label>${sel(2)}${sel(3)}</div>
  <button class="btn gold" data-act="start">ابدأ الصكة</button>
  ${nx?'<button class="btn alt" data-act="back" style="margin-top:8px">رجوع</button>':''}</div>
  <div class="card"><h2>اللاعبين</h2><div class="chips">${players.map(p=>`<span class="who">${esc(p)}</span>`).join('')}</div>
  <div class="row"><input id="np" placeholder="أضف لاعب جديد"><button class="btn alt" style="flex:0 0 90px" data-act="addp">إضافة</button></div></div>`;
}

const tot=o=>{const r=(o&&o.rounds)||[];return [r.reduce((s,x)=>s+x.a,0),r.reduce((s,x)=>s+x.b,0)]};
function board(sa,sb){
  const t=live.target;
  const c=(n,s,l)=>`<div class="cir ${l?'lead':''}" style="--p:${Math.min(100,s/t*100)}%"><div class="in"><b>${s}</b><small>${tn(n)}</small></div></div>`;
  return `<div class="bd">${c(live.a,sa,sa>sb)}${c(live.b,sb,sb>sa)}</div>`;
}
function liveView(){
  const [sa,sb]=sums(),r=live.rounds||[],fin=!!live.finished,own=live.owner===devId;
  const bd=board(sa,sb);
  let mg='';
  if(own){
    if(editTeams){
      const sl=i=>`<select data-act="tsel" data-i="${i}">`+players.map(p=>`<option ${p===tm[i]?'selected':''}>${esc(p)}</option>`).join('')+`</select>`;
      mg=`<div class="card"><h2>تعديل الفريقين</h2><div class="team"><label>لنا</label>${sl(0)}${sl(1)}</div><div class="team"><label>لهم</label>${sl(2)}${sl(3)}</div><div class="row"><button class="btn" data-act="tsave">حفظ</button><button class="btn alt" data-act="tback">رجوع</button></div></div>`;
    }else{
      mg=`<div class="row" style="margin-bottom:12px"><button class="btn alt" data-act="etm">✏️ تعديل الفريقين</button><button class="btn bad" data-act="cancelg">إلغاء الصكة</button></div>`;
    }
  }
  let mid;
  if(fin){
    const w=live.win==='A'?live.a:live.b;
    const nb=live.tour?'<button class="btn gold" data-act="tab" data-v="tour">🏆 رجوع للبطولة</button>':'<button class="btn gold" data-act="next">صكة جديدة، الفايز مستمر</button>';
    mid=`<div class="card" style="text-align:center"><h2>🏆 فاز ${tn(w)}</h2><div class="note">${sa} - ${sb}</div><div class="row" style="margin-top:10px">${own?'<button class="btn alt" data-act="undo">↩ تراجع</button>':''}${nb}</div></div>`;
  }else if(own){
    mid=`<div class="card"><h2>مشترى جديد</h2><div class="row"><input id="ia" type="number" inputmode="numeric" placeholder="لنا"><input id="ib" type="number" inputmode="numeric" placeholder="لهم"></div><button class="btn" style="margin-top:10px" data-act="round">سجّل المشترى</button></div>`;
  }else{
    mid=`<div class="card" style="text-align:center"><div class="note">أنت تتابع الصكة، التسجيل من الجهاز اللي بدأها</div></div>`;
  }
  const rows=r.map((x,i)=>i===editIdx&&own&&!fin
    ?`<li style="gap:6px;align-items:center"><span>${i+1}</span><input id="ea" type="number" inputmode="numeric" value="${x.a}" style="width:64px;padding:6px"><input id="eb" type="number" inputmode="numeric" value="${x.b}" style="width:64px;padding:6px"><span><button class="btn" style="padding:6px 10px;width:auto" data-act="esave" data-v="${i}">حفظ</button> <button class="btn alt" style="padding:6px 10px;width:auto" data-act="ecancel">إلغاء</button></span></li>`
    :`<li style="align-items:center"><span>${i+1}</span><span>${x.a}</span><span>${x.b}</span><span style="min-width:60px;text-align:left">${own&&!fin&&i===r.length-1?`<button class="btn alt" style="padding:4px 10px;width:auto" data-act="eedit" data-v="${i}">تعديل</button>`:''}</span></li>`).join('');
  const lt=live.tour,tb=lt&&T&&T.tid===lt.tid&&T.teams?`<div class="tbanner">🏆 ${esc(rname(parseInt(lt.k.slice(1))))}: ${esc(T.teams[lt.ta].n)} ضد ${esc(T.teams[lt.tb].n)}</div>`:'';
  return `${tb}${bd}<div style="height:12px"></div>${mid}<div style="height:12px"></div>
  <div class="row" style="margin-bottom:12px"><button class="btn alt" data-act="snd">${snd?'🔊 الصوت يعمل':'🔇 الصوت مغلق'}</button>${own?'':'<button class="btn alt" data-act="take">سجّل من هذا الجهاز</button>'}</div>
  ${mg}<div class="card"><h2>المشتريات (${r.length})</h2>
  ${r.length?`<ul class="rounds">${rows}</ul>`:'<div class="empty">ما سجلتوا مشتريات بعد</div>'}
  ${own&&!fin&&r.length?`<div class="row" style="margin-top:12px"><button class="btn alt" data-act="undo">↩ تراجع</button></div>`:''}</div>`;
}

/* ================= الإحصائيات =================
   المجلس = صكات حاسبة التسجيل فقط، والأونلاين لحاله.
   كل شي يُحسب لكل لاعب لحاله (الفرق تتغير)، والألقاب تنعطى كل ليلة + حسبة تراكمية. */
let smode='off',sview2='night',sNight=null,sPlayer=null,sH=['',''];
const NT=[
  {i:'👑',n:'شيخ المجلس',min:4,c:'#c9971f',d:'فوق بـ 4 وأكثر',pt:6},
  {i:'🦅',n:'الصقر',min:3,c:'#b07a1e',d:'فوق بـ 3',pt:5},

const nk=ts=>{const d=new Date(ts-6*3600e3);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

function agg(gs){
  const P={};
  const gp=n=>P[n]=P[n]||{k:n,n:0,w:0,l:0,form:[],cs:0,ms:0,with:{},vs:{},sa:0};
  for(const g of gs){
    const bot=n=>Array.isArray(g.bots)&&g.bots.includes(n);   // الكمبيوتر ما يدخل في الإحصائيات
    [[g.a,g.b,g.winner==='A'],[g.b,g.a,g.winner==='B']].forEach(([t,o,win])=>t.forEach(n=>{
      if(bot(n))return;
      const x=gp(n);x.n++;win?x.w++:x.l++;x.form.push(win);x.cs=win?x.cs+1:0;x.ms=Math.max(x.ms,x.cs);
      t.filter(m=>m!==n&&!bot(m)).forEach(m=>{const q=x.with[m]=x.with[m]||{n:0,w:0};q.n++;if(win)q.w++});
      o.filter(m=>!bot(m)).forEach(m=>{const q=x.vs[m]=x.vs[m]||{n:0,w:0};q.n++;if(win)q.w++});
    }));
  }
  return Object.values(P).map(x=>(x.net=x.w-x.l,x.r=x.w/x.n,x)).sort((a,b)=>b.net-a.net||b.w-a.w||a.n-b.n||a.k.localeCompare(b.k));
}
function byNight(gs){const m={};gs.forEach(g=>{(m[nk(g.ts)]=m[nk(g.ts)]||[]).push(g)});return m}

function cabinet(gs){
  const N=byNight(gs),C={};
  Object.keys(N).sort().forEach(k=>{
    const pl=agg(N[k]);
    pl.forEach((x,i)=>{
      const c=C[x.k]=C[x.k]||{k:x.k,cnt:NT.map(()=>0),pts:0,nights:0,stars:0,best:null,run:[]};
      const t=ttlOf(NT,x.net),ti=NT.indexOf(t);
      c.cnt[ti]++;c.pts+=t.pt;c.nights++;if(i===0&&x.net>0)c.stars++;
      if(!c.best||x.net>c.best.net)c.best={k,net:x.net,w:x.w,n:x.n};
      c.run.push({k,net:x.net});
    });
  });
  return Object.values(C).sort((a,b)=>b.pts-a.pts||b.cnt[0]-a.cnt[0]||a.k.localeCompare(b.k));
}

function calcStats(gs){
  const R=gs.filter(g=>Array.isArray(g.rounds)&&g.rounds.length);
  if(!R.length)return `<div class="xsoon"><div><b>🔄 أكبر رجعة</b>الفريق اللي كان متأخر بأكبر فارق ورجع فاز</div><div><b>⚡ أسرع صكة</b>أقل عدد توزيعات لين 152</div><div><b>💯 أكبر توزيعة</b>أعلى نقاط في توزيعة وحدة</div><div><b>📏 متوسط التوزيعة</b>كم يجيب الفريق في التوزيعة</div></div><p class="note">هذي تبدأ تنحسب من الصكات اللي تتسجل بعد التحديث.</p>`;

  });
  const c=(i,t,v,w)=>`<div class="xtile xbig"><small>${i} ${t}</small><b>${v}</b><span>${w}</span></div>`;
  return `<div class="xtiles" style="grid-template-columns:1fr 1fr">${c('🔄','أكبر رجعة',cb.v>0?'متأخرين '+cb.v:'—',cb.v>0?tn(cb.t):'')}${c('⚡','أسرع صكة',fast.v+' توزيعات',tn(fast.t))}${c('💯','أكبر توزيعة',big.v,tn(big.t))}${c('📏','متوسط التوزيعة',Math.round(sum/cnt),'نقطة للفريق')}</div><p class="note">من ${R.length} صكة فيها تفاصيل التوزيعات.</p>`;
}
function cumChart(gs,names){

let T=null,tsel=new Set(),swp=null,anim=null,animT=null,actx=null;
const TNAMES=['🦅 الصقور','🐺 الذيابة','🐯 النمور','🦁 الأسود','🐆 الفهود','⚡ الصواعق','🔥 الشعلة','🌪️ الإعصار','🐎 الخيالة','⭐ النجوم','🌙 الهلال','🗡️ السيوف','🐪 الهجن','🦂 العقارب','🌊 الموج','☄️ الشهب'];
const rnd=n=>{try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}catch(e){return Math.floor(Math.random()*n)}};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const strip=s=>String(s).replace(/^\S+\s/,'');
// أول دور: لو عدد الفرق مو من مضاعفات 2، بعض الفرق تتأهل مباشرة (راحة) موزعة على الجدول
function buildFirst(order){
  const n=order.length;let size=1;while(size<n)size*=2;
  const half=size/2,byes=size-n,bm=new Set();for(let k=0;k<byes;k++)bm.add(Math.floor(k*half/byes));
  const f=[];let q=0;
  for(let i=0;i<half;i++)f.push(bm.has(i)?{a:order[q++],b:-1}:{a:order[q++],b:order[q++]});
  return f;
}
function makeDraw(pl){
  const s=shuf(pl),nm=shuf(TNAMES),teams=[];
  for(let i=0;i<s.length;i+=2)teams.push({n:nm[i/2],p:[s[i],s[i+1]]});
  return {teams,first:buildFirst(shuf(teams.map((_,i)=>i)))};
}
// -1 = راحة ، -2 = بانتظار الفايز
function bracket(t){
  const R=[];let cur=t.first.map(x=>({a:x.a,b:x.b})),r=0,no=0;const res=t.res||{};
  for(;;){
    cur.forEach((m,i)=>{
      m.k='m'+r+'_'+i;m.r=r;m.i=i;m.w=null;m.bye=false;
      if(m.a>=0&&m.b===-1){m.w=m.a;m.bye=true}
      else{
        if(m.a>=0&&m.b>=0){m.no=++no;const x=res[m.k];if(x&&(x.w===m.a||x.w===m.b)){m.w=x.w;m.x=x.x;m.y=x.y}}
      }
    });
    R.push(cur);if(cur.length===1)break;
    const nx=[];for(let i=0;i<cur.length;i+=2)nx.push({a:cur[i].w??-2,b:cur[i+1].w??-2});
    cur=nx;r++;
  }
  return R;
}
function rname(r,t=T){const n=t.first.length*2/Math.pow(2,r);return n<=2?'النهائي':n===4?'نصف النهائي':n===8?'ربع النهائي':'دور الـ'+n}
const champOf=R=>{const f=R[R.length-1][0];return f.w!=null&&f.w>=0?f.w:null};

function tone(f,d,type,v,at){if(!snd)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime+(at||0),o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}

function confetti(){

  const x=c.getContext('2d'),W=c.width=innerWidth*d,H=c.height=innerHeight*d,cols=['#e0b84a','#2e8b5b','#ffffff','#b3392f','#3fae75'];
  const ps=Array.from({length:170},()=>({x:Math.random()*W,y:-Math.random()*H*.6,vx:(Math.random()-.5)*4*d,vy:(2+Math.random()*5)*d,s:(5+Math.random()*7)*d,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[rnd(cols.length)]}));
  const t0=Date.now();(function f(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});Date.now()-t0<4500?requestAnimationFrame(f):c.remove()})()}catch(e){}

  }).join('')).join('');

function tourView(){
  if(!T||!T.teams||T.stage==='none')return tourSetup();
  const own=T.owner===devId,R=bracket(T);
  const org=`<p class="note" style="text-align:center">المنظم: ${esc(T.by||'—')}${own?' (أنت)':''}</p>`;
  const take=own?'':`<button class="btn alt" data-act="ttake" style="margin-top:8px">أنا المنظم (التحكم من هذا الجهاز)</button>`;
  if(T.stage==='drawn'){
    const tcs=T.teams.map((t,i)=>{
      if(anim&&i>anim.n)return `<div class="tc hid"><div class="tn3">🂠</div><div class="sp">؟</div></div>`;
      if(anim&&i===anim.n)return `<div class="tc spin"><div class="tn3">🎲 الفريق ${i+1}</div><div class="sp" id="spin">…</div></div>`;
      return `<div class="tc ${anim&&i===anim.n-1?'pop':''}"><div class="tn3">${esc(t.n)}</div>${t.p.map((p,j)=>`<button ${own&&!anim?`data-act="tsw" data-t="${i}" data-j="${j}"`:'disabled'} class="${swp&&swp[0]===i&&swp[1]===j?'sw':''}">${esc(p)}</button>`).join('')}</div>`;
    }).join('');
    if(anim)return `<div class="card"><h2>🎲 القرعة جارية…</h2><div class="tg">${tcs}</div><button class="btn alt" data-act="tskip" style="margin-top:10px">تخطي ⏭</button></div>`;
    return `<div class="card"><h2>🎲 نتيجة القرعة</h2>${own?'<p class="note">تبغى تغيّر؟ اضغط على لاعبين وبيتبادلون أماكنهم.</p>':''}<div class="tg">${tcs}</div>
    ${own?`<div class="row" style="margin-top:12px"><button class="btn alt" data-act="tredraw">🎲 أعد القرعة</button><button class="btn alt" data-act="tmix">🔀 غيّر المواجهات</button></div>
    <button class="btn gold" data-act="tlock" style="margin-top:8px">✅ اعتمد القرعة وابدأ البطولة</button>
    <button class="btn bad" data-act="tnew" style="margin-top:8px">إلغاء البطولة</button>`:take}${org}</div>
    <div class="card"><h2>المواجهات</h2>${bracketHtml(R,false,null)}</div>`;
  }
  const c=champOf(R);let top='';
  const all=R.flat().filter(m=>!m.bye),left=all.filter(m=>m.w==null).length;
  if(c!=null){const t=T.teams[c];top=`<div class="champ"><div class="cup">🏆</div><div class="note" style="color:#1b1500">أبطال البطولة</div><div class="nm">${esc(t.n)}</div><div style="font-weight:700;margin-top:4px">${tn(t.p)}</div></div>`}
  const nx=all.find(m=>m.a>=0&&m.b>=0&&m.w==null);
  if(nx){
    const A=T.teams[nx.a],B=T.teams[nx.b],first=!Object.keys(T.res||{}).length;
    const running=live&&live.active&&!live.finished&&live.tour&&live.tour.tid===T.tid&&live.tour.k===nx.k;
    top=`<div class="hero"><span class="tag">${first?'🎬 مباراة الافتتاح':nx.r===R.length-1?'👑 المباراة النهائية':'🔥 المباراة القادمة'}</span>
    <div class="rnd">${rname(nx.r)} · المباراة ${nx.no}</div>
    <div class="duel"><div class="side"><div class="nm">${esc(A.n)}</div><div class="ps">${tn(A.p)}</div></div><div class="x">VS</div><div class="side"><div class="nm">${esc(B.n)}</div><div class="ps">${tn(B.p)}</div></div></div>
    ${running?'<button class="btn gold" data-act="tab" data-v="game" style="margin-top:14px">🃏 الصكة شغالة، تابعها</button>':own?`<button class="btn gold" data-act="tplay" data-k="${nx.k}" style="margin-top:14px">▶️ ابدأ الصكة</button>`:''}
    <p class="note" style="margin-top:8px">باقي ${left} ${left===1?'مباراة':'مباريات'}${own?' · أو اضغط على الفريق الفايز تحت لتسجيله يدوي':''}</p></div>`;
  }
  return `${top}<div class="card"><h2>جدول البطولة</h2>${bracketHtml(R,own,nx)}</div>
  <div class="card">${own||c!=null?`<div class="row"><button class="btn alt" data-act="tredraw">🎲 قرعة جديدة</button><button class="btn ${c!=null?'gold':'bad'}" data-act="tnew">${c!=null?'🏆 بطولة جديدة':'إنهاء البطولة'}</button></div>`:''}${take}${org}</div>`;
}

    const d=makeDraw(pl),now=Date.now();
    await saveT({tid:now,drawId:now,stage:'drawn',owner:devId,by:me||'',players:pl,teams:d.teams,first:d.first,res:{},ts:now});
  }
  else if(a==='tskip'){anim=null;clearInterval(animT);render()}

  else if(a==='ttake'){if(confirm('تتحكم بالبطولة من هذا الجهاز؟'))await updT({owner:devId,by:me||''})}
  else if(!own&&a!=='tnew')return;
  else if(a==='tsw'){
    if(T.stage!=='drawn')return;
    const t=+b.dataset.t,j=+b.dataset.j;
    if(!swp){swp=[t,j];return render()}
    if(swp[0]===t&&swp[1]===j){swp=null;return render()}
    const tm2=T.teams.map(x=>({n:x.n,p:[...x.p]})),[t0,j0]=swp;
    [tm2[t0].p[j0],tm2[t].p[j]]=[tm2[t].p[j],tm2[t0].p[j0]];swp=null;
    await updT({teams:tm2});
  }
  else if(a==='tmix'){if(T.stage!=='drawn')return;await updT({first:buildFirst(shuf(T.teams.map((_,i)=>i))),res:{}});tick();boom()}
  else if(a==='tredraw'){
    if(Object.keys(T.res||{}).length&&!confirm('قرعة جديدة بتمسح نتايج البطولة، متأكد؟'))return;
    const d=makeDraw(T.players),now=Date.now();
    await saveT({...T,tid:now,drawId:now,stage:'drawn',owner:devId,teams:d.teams,first:d.first,res:{}});
  }
  else if(a==='tlock'){await updT({stage:'locked'});fanfare();speak('بسم الله، انطلقت البطولة')}
  else if(a==='tnew'){
    if(T.stage!=='done'&&!own)return;
    if(T.stage!=='done'&&!confirm('تبغى تنهي البطولة الحالية؟'))return;
    tsel=new Set((T.players||[]).filter(p=>players.includes(p)));
    await saveT({stage:'none'});
  }
  else if(a==='tw'){
    const k=b.dataset.k,t=+v,m=bracket(T).flat().find(x=>x.k===k);if(!m)return;
    if(m.w===t){if(confirm('تلغي نتيجة هذي المباراة؟'))await tourSetResult(k,null)}
    else if(confirm('فوز '+strip(T.teams[t].n)+'؟'+(m.w!=null?' (بيتغير الفايز وتنمسح النتايج اللي بعدها)':'')))await tourSetResult(k,t,null,null);
  }
  else if(a==='tplay'){
    const m=bracket(T).flat().find(x=>x.k===b.dataset.k);if(!m||m.a<0||m.b<0)return;
    if(live&&live.active&&!live.finished&&!confirm('فيه صكة شغالة، تبغى تلغيها وتبدأ مباراة البطولة؟'))return;
    editIdx=-1;nextSetup=false;editTeams=false;
    await saveLive({active:true,finished:false,gid:Date.now(),owner:devId,a:[...T.teams[m.a].p],b:[...T.teams[m.b].p],target:152,rounds:[],gameId:null,win:null,tour:{tid:T.tid,k:m.k,ta:m.a,tb:m.b}});
    tab='game';render();speak(strip(T.teams[m.a].n)+' ضد '+strip(T.teams[m.b].n)+'، بالتوفيق');
  }
});

/* ================= توزيع الفرق =================
   أي واحد يختار الحاضرين، والتطبيق يوزعهم كل اثنين مع بعض.
   النتيجة تنحفظ في live/draw وتظهر لكل الأجهزة مع حركة الكشف. */
let D=null,dPick=null,dEdit=false,dSeen='',dSeenAt=0,dSpoke='';
function dLoad(){if(dPick)return;dPick=new Set(D&&D.players?D.players.filter(p=>players.includes(p)):[])}
// يوزع ويحاول ما يكرر نفس الشريك من القرعة اللي قبل
function dMake(list){
  const prev=new Set((D&&D.teams||[]).map(t=>[...t.p].sort().join('|')));
  let best=null,bs=1e9;
  for(let k=0;k<60;k++){
    const s=shuf(list),teams=[];
    for(let i=0;i+1<s.length;i+=2)teams.push([s[i],s[i+1]]);
    const rep=teams.filter(t=>prev.has([...t].sort().join('|'))).length;
    if(rep<bs){bs=rep;best={s,teams};if(!rep)break}
  }
  const nm=shuf(TNAMES);
  return {id:Date.now()+'_'+rnd(1e6),ts:Date.now(),by:me||'',players:list,
    teams:best.teams.map((p,i)=>({n:nm[i%nm.length],p})),spare:list.length%2?best.s[best.s.length-1]:null};
}
async function dSave(o){
  D=o;dEdit=false;render();dReveal();
  try{await db.doc('live/draw').set(o)}catch(e){console.error(e);alert('انحفظت القرعة على جهازك بس، تعذر مشاركتها (تأكد من الإنترنت)')}
}
function dReveal(){
  if(!D||!D.teams)return;
  if(dSpoke===D.id)return;dSpoke=D.id;
  if(Date.now()-(D.ts||0)>60000)return;          // قرعة قديمة: بدون صوت
  D.teams.forEach((t,i)=>setTimeout(()=>{if(D&&D.id===dSpoke){boom();speak('الفريق '+(i+1)+'، '+t.p.join(' و '))}},400+i*1500));
  setTimeout(()=>{if(D&&D.id===dSpoke){fanfare();try{confetti()}catch(e){}}},600+D.teams.length*1500);
}
const dAv=n=>`<span class="dav">${esc(String(n).trim().charAt(0)||'؟')}</span>`;
function drawView(){
  dLoad();
  if(D&&D.id&&D.id!==dSeen){dSeen=D.id;dSeenAt=Date.now()}
  const hero=`<div class="dhero"><div class="xsadu"></div><div class="dh"><span class="dic">🎲</span><div><b>توزيع الفرق</b><small>اختر الحاضرين، ونوزعكم كل اثنين مع بعض</small></div></div></div>`;
  const back=`<button class="btn alt" data-act="tab" data-v="game" style="margin-top:4px">↩ رجوع للصكة</button>`;
  // صفحة النتيجة
  if(D&&D.teams&&!dEdit){
    const el=(Date.now()-dSeenAt)/1000,step=1.5;
    const card=(t,i)=>`<div class="dteam" style="--i:${i};animation-delay:${(i*step+.3-el).toFixed(2)}s"><div class="dnum">${i+1}</div><div class="dtn">الفريق ${i+1}</div>
      <div class="dpair">${t.p.map(n=>`<div class="dpl">${dAv(n)}<b>${esc(n)}</b></div>`).join('<span class="damp">+</span>')}</div></div>`;
    const spare=D.spare?`<div class="dspare" style="animation-delay:${(D.teams.length*step+.3-el).toFixed(2)}s">⏳ <b>${esc(D.spare)}</b> احتياط هالمرة، يدخل مكان أول فريق يخسر</div>`:'';
    const ms=[];for(let i=0;i<D.teams.length;i++)for(let j=i+1;j<D.teams.length;j++)ms.push([i,j]);
    const matches=D.teams.length>=2?`<div class="xsec">🎴 ابدأ صكة</div><div class="dmatch">${ms.slice(0,6).map(([i,j])=>`<button data-act="dgo" data-v="${i},${j}"><span>${tn(D.teams[i].p)}</span><em>ضد</em><span>${tn(D.teams[j].p)}</span></button>`).join('')}</div><p class="note">تضغط على المواجهة وتنفتح الحاسبة بالفريقين على طول.</p>`:'';
    const when=new Date(D.ts).toLocaleString('ar-SA-u-ca-gregory-nu-latn',{weekday:'long',hour:'numeric',minute:'2-digit'});
    return hero+`<div class="dmeta">${D.players.length} لاعبين · ${D.teams.length} فرق · ${when}${D.by?' · وزّعها '+esc(D.by):''}</div>
    <div class="dteams">${D.teams.map(card).join('')}</div>${spare}
    <div class="dact"><button class="btn gold" data-act="dagain">🔁 أعد التوزيع</button><button class="btn alt" data-act="dedit">✏️ غيّر الحاضرين</button></div>${matches}${back}`;
  }
  // صفحة الاختيار
  const n=dPick.size,odd=n%2===1;
  const chips=players.map(p=>`<button class="dchip ${dPick.has(p)?'on':''}" data-act="dtog" data-v="${esc(p)}">${dAv(p)}<span>${esc(p)}</span><i>✓</i></button>`).join('');
  return hero+`<div class="card"><div class="dtop"><b>مين حاضر الليلة؟</b><span><button class="dlink" data-act="dall">الكل</button> · <button class="dlink" data-act="dnone">مسح</button></span></div>
    <div class="dchips">${chips||'<div class="note">ما فيه لاعبين، أضف من تحت</div>'}</div>
    <div class="row" style="margin-top:12px"><input id="dnp" placeholder="لاعب جديد؟ اكتب اسمه"><button class="btn alt" style="flex:0 0 90px" data-act="dadd">إضافة</button></div></div>
    <div class="dbar"><div><b>${n}</b> مختارين${n>=4&&odd?'<small>العدد فردي، واحد بيكون احتياط</small>':n<4?'<small>اختر 4 على الأقل</small>':`<small>${n/2} فرق</small>`}</div>
    <button class="btn gold" data-act="dgo2" ${n<4?'disabled':''}>🎲 وزّع الفرق</button></div>
    ${D&&D.teams?`<button class="btn alt" data-act="dcancel" style="margin-top:8px">رجوع لآخر قرعة</button>`:back}`;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act^="d"]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(!['dtog','dall','dnone','dadd','dgo2','dagain','dedit','dcancel','dgo','dopen'].includes(a))return;
  if(a==='dopen'){tab='draw';dPick=null;render();window.scrollTo(0,0);return}
  dLoad();
  if(a==='dtog'){dPick.has(v)?dPick.delete(v):dPick.add(v);try{tick()}catch(err){}render()}
  else if(a==='dall'){players.forEach(p=>dPick.add(p));render()}
  else if(a==='dnone'){dPick.clear();render()}
  else if(a==='dadd'){const n=await addPlayer($('#dnp').value);if(n){dPick.add(n);render()}}
  else if(a==='dgo2'){if(dPick.size<4)return;await dSave(dMake(shuf([...dPick])));window.scrollTo({top:0,behavior:'smooth'})}
  else if(a==='dagain'){if(!D)return;await dSave(dMake(shuf(D.players)));window.scrollTo({top:0,behavior:'smooth'})}
  else if(a==='dedit'){dPick=new Set(D.players);dEdit=true;render()}
  else if(a==='dcancel'){dEdit=false;render()}
  else if(a==='dgo'){
    const [i,j]=v.split(',').map(Number),A=D.teams[i],B=D.teams[j];
    if(live&&live.active&&!live.finished&&!confirm('فيه صكة شغالة الحين، تبدأ صكة جديدة بدالها؟'))return;
    await saveLive({active:true,finished:false,gid:Date.now(),owner:devId,a:[...A.p],b:[...B.p],target:152,rounds:[],gameId:null,win:null});
    nextSetup=false;tab='game';render();speak(A.p.join(' و ')+' ضد '+B.p.join(' و ')+'، بالتوفيق');window.scrollTo(0,0);
  }
});

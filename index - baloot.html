<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نشرة البلوت</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="نشرة البلوت">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f1e8;--card:#fff;--ink:#17241c;--mut:#6b7a70;--acc:#b8860b;--g:#1f6b45;--g2:#2e8b5b;--line:#e2ded0;--bad:#b3392f;--chip:#e9efe9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1a14;--card:#17271d;--ink:#eef3ee;--mut:#8fa396;--acc:#e0b84a;--g:#2e8b5b;--g2:#3fae75;--line:#26382d;--bad:#e5645a;--chip:#1f3326}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1a14;--card:#17271d;--ink:#eef3ee;--mut:#8fa396;--acc:#e0b84a;--g:#2e8b5b;--g2:#3fae75;--line:#26382d;--bad:#e5645a;--chip:#1f3326}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;min-height:100%}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:24px;margin:0;font-weight:800}h1 span{color:var(--acc)}
.who{font-size:13px;color:var(--mut);background:var(--chip);padding:5px 10px;border-radius:99px;cursor:pointer}
.tabs{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:14px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:700;padding:10px 4px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--g);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:17px}
.btn{border:0;background:var(--g);color:#fff;font:inherit;font-weight:700;padding:12px 16px;border-radius:12px;cursor:pointer;width:100%}
.btn.alt{background:var(--chip);color:var(--ink)}.btn.gold{background:var(--acc);color:#1b1500}.btn.bad{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px}.row>*{flex:1}
select,input{font:inherit;width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.team{border-radius:14px;padding:12px;margin-bottom:10px;border:1px dashed var(--line)}
.team label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px;font-weight:700}
.team select{margin-bottom:6px}
.vs{text-align:center;color:var(--acc);font-weight:800;margin:4px 0}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tm{background:linear-gradient(160deg,var(--g),#164d32);color:#fff;border-radius:18px;padding:14px;text-align:center}
.tm.lead{outline:3px solid var(--acc)}
.tm small{display:block;opacity:.85;font-size:13px;min-height:36px}
.tm b{display:block;font-size:46px;line-height:1.1;margin-top:4px}
.bar{height:6px;background:rgba(255,255,255,.25);border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.rounds{margin:0;padding:0;list-style:none}.rounds li{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line);font-size:15px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.st small{color:var(--mut);display:block;font-size:12px}.st b{font-size:17px;display:block;margin-top:2px}.st em{font-style:normal;color:var(--acc);font-weight:700;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500;font-size:12px}td:first-child,th:first-child{text-align:right}
.scroll{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chips button{border:0;background:var(--chip);color:var(--ink);font:inherit;padding:9px 14px;border-radius:99px;cursor:pointer;font-weight:700}
.note{color:var(--mut);font-size:13px;margin:6px 0}
.empty{text-align:center;color:var(--mut);padding:22px 8px}
.win{color:var(--g2);font-weight:700}
.icons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}.ic{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 2px;font:inherit;cursor:pointer;text-align:center}.ic span{display:block;font-size:24px;line-height:1.3}.ic small{font-size:11px;color:var(--mut)}.ic.on{background:var(--g);border-color:var(--g)}.ic.on small{color:#fff}
.bd{display:flex;gap:14px;justify-content:center}
.cir{width:min(44vw,176px);aspect-ratio:1;border-radius:50%;padding:9px;background:conic-gradient(var(--acc) var(--p),var(--line) 0)}
.cir.lead{box-shadow:0 0 0 3px var(--acc)}
.cir .in{width:100%;height:100%;border-radius:50%;background:var(--g);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px}
.half{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.half.flip{border-top:1px solid rgba(255,255,255,.25)}
.half b{font-size:clamp(30px,10.5vw,46px);line-height:1;font-weight:800}
.cir small{font-size:11px;opacity:.92;line-height:1.3;margin:2px 0}
.flip{transform:rotate(180deg)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tm{background:linear-gradient(160deg,var(--g),#164d32);color:#fff;border-radius:18px;padding:10px;text-align:center}
.tm.lead{outline:3px solid var(--acc)}
.tp{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0}
.tp.flip{transform:rotate(180deg);border-bottom:1px solid rgba(255,255,255,.25)}
.tp small{font-size:12px;opacity:.9;line-height:1.3;min-height:16px}
.tp b{font-size:42px;line-height:1.1;font-weight:800}
.tm .bar{height:6px;background:rgba(255,255,255,.25);border-radius:9px;margin-top:6px;overflow:hidden}.tm .bar i{display:block;height:100%;background:var(--acc)}
.tm{padding:14px}
.tm small{display:block;opacity:.85;font-size:13px;min-height:36px;line-height:1.3}
.tm b{display:block;font-size:46px;line-height:1.1;margin-top:4px;font-weight:800}
.cir b{display:block;font-size:clamp(44px,15vw,68px);line-height:1.05;font-weight:800}
.cir small{display:block;font-size:13px;opacity:.92;line-height:1.3;margin-top:6px;max-width:90%}
/* ===== البطولة ===== */
.tabs button{font-size:14px;padding:10px 2px}
.chips button.on{background:var(--g);color:#fff}
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#2e8b5b,#123d27);color:#fff;border-radius:20px;padding:18px 14px;margin-bottom:12px;text-align:center;animation:glow 2.2s infinite}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(224,184,74,.55)}70%{box-shadow:0 0 0 12px rgba(224,184,74,0)}100%{box-shadow:0 0 0 0 rgba(224,184,74,0)}}
.hero .tag{display:inline-block;background:#e0b84a;color:#1b1500;font-weight:800;font-size:12px;padding:4px 12px;border-radius:99px}
.hero .rnd{font-size:19px;font-weight:800;margin:8px 0 14px}
.duel{display:flex;align-items:center;gap:8px}
.duel .side{flex:1;min-width:0}
.duel .nm{font-size:18px;font-weight:800}
.duel .ps{font-size:13px;opacity:.85;margin-top:3px}
.duel .x{font-size:28px;font-weight:800;color:#e0b84a;text-shadow:0 0 12px rgba(224,184,74,.6);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.hero .note{color:#fff;opacity:.8}
.rh{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;font-weight:800;font-size:15px;color:var(--acc)}
.rh:after{content:"";flex:1;height:1px;background:var(--line)}
.mc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.mc.nx{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.mc .mh{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);padding:6px 12px 0}
.mt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;width:100%;border:0;background:none;color:var(--ink);font:inherit;text-align:right}
button.mt{cursor:pointer}
.mt+.mt{border-top:1px dashed var(--line)}
.mt .tn2{font-weight:700}.mt .tp2{display:block;font-size:12px;color:var(--mut)}
.mt.w{background:rgba(224,184,74,.15)}.mt.w .tn2:after{content:" ✓";color:var(--acc)}
.mt.l{opacity:.45}.mt.l .tn2{text-decoration:line-through}
.mt.tbd .tn2{color:var(--mut);font-weight:400}
.mt b{font-size:16px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.tc.pop{animation:pop .5s ease}
.tc .tn3{font-weight:800;font-size:15px;margin-bottom:4px}
.tc button{display:block;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;padding:7px;border-radius:10px;margin-top:5px;cursor:pointer}
.tc button:disabled{cursor:default}
.tc button.sw{background:var(--acc);color:#1b1500;border-color:var(--acc)}
.tc.hid{opacity:.45}.tc.hid .tn3{font-size:30px}
.tc.spin{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.tc .sp{font-weight:700;font-size:14px;min-height:44px;display:flex;align-items:center;justify-content:center}
@keyframes pop{0%{transform:scale(.6) rotateY(90deg);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}
.champ{text-align:center;background:linear-gradient(160deg,#e0b84a,#b8860b);color:#1b1500;border-radius:20px;padding:22px 14px;margin-bottom:12px;animation:pop .6s ease}
.champ .cup{font-size:60px;line-height:1}
.champ .nm{font-size:25px;font-weight:800;margin-top:6px}
.tbanner{background:var(--chip);border-radius:12px;padding:8px 12px;text-align:center;font-weight:700;font-size:14px;margin-bottom:12px}
</style>

</head>
<body>
<div class="wrap">
<header><h1>🃏 نشرة <span>البلوت</span></h1><div class="who" id="who"></div></header>
<div class="tabs" id="tabs"></div>
<main id="main"><div class="empty">جاري التحميل…</div></main>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,user,uid,meDoc,me=null,players=[],games=[],live=null,tab='game',canWrite=true,loaded={p:0,g:0,l:0,m:0,t:0};
let devId='',snd=true,nextSetup=false,editTeams=false,tm=['','','',''];
try{devId=localStorage.getItem('baloot_dev');if(!devId){devId=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('baloot_dev',devId)}}catch(e){devId='tmp'+Math.random()}
try{snd=localStorage.getItem('baloot_snd')!=='0'}catch(e){}
let setup={p:['','','',''],target:152};let period='all',editIdx=-1,sview='wins';
const TABS=[['game','الصكة'],['online','أونلاين'],['tour','البطولة'],['stats','إحصائيات'],['hist','السجل']];

function sums(){const r=(live&&live.rounds)||[];return [r.reduce((s,x)=>s+x.a,0),r.reduce((s,x)=>s+x.b,0)]}
const tn=a=>a.map(esc).join(' و ');

const mkey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+(d.getMonth()+1)};
const fg=()=>period==='all'?[...games]:games.filter(g=>mkey(g.ts)===period);
function filterBar(){
  const ks=[...new Set(games.map(g=>mkey(g.ts)))].sort((a,b)=>{const[x,y]=a.split('-').map(Number),[p,q]=b.split('-').map(Number);return (p*12+q)-(x*12+y)});
  const lbl=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('ar',{month:'long',year:'numeric'})};
  return `<div class="card"><label class="note">الفترة</label><select data-act="period"><option value="all">كل الوقت</option>${ks.map(k=>`<option value="${k}" ${k===period?'selected':''}>${lbl(k)}</option>`).join('')}</select></div>`;
}
function stats(){
  const P={},T={},streak={};let rec=null;
  const gs=fg().sort((x,y)=>x.ts-y.ts);const PR={},RV={};
  const bump=(o,k,w)=>{o[k]=o[k]||{n:0,w:0};o[k].n++;if(w)o[k].w++};
  gs.forEach(g=>{
    const wa=g.winner==='A',A=g.a,B=g.b;
    A.forEach(n=>{bump(P,n,wa);const s=streak[n]=streak[n]||{c:0,m:0};if(wa){s.c++;s.m=Math.max(s.m,s.c)}else s.c=0});
    B.forEach(n=>{bump(P,n,!wa);const s=streak[n]=streak[n]||{c:0,m:0};if(!wa){s.c++;s.m=Math.max(s.m,s.c)}else s.c=0});
    bump(T,[...A].sort().join(' و '),wa);bump(T,[...B].sort().join(' و '),!wa);
    [[A,B,wa],[B,A,!wa]].forEach(([t,o,w])=>{const k=[...t].sort().join(' و '),ok=[...o].sort().join(' و ');t.forEach((n,i)=>{PR[n]=PR[n]||{};bump(PR[n],t[1-i],w)});RV[k]=RV[k]||{};bump(RV[k],ok,w)});
    const d=Math.abs(g.sa-g.sb);if(!rec||d>rec.d)rec={d,g};
  });
  const pl=Object.entries(P).map(([k,v])=>({k,...v,r:v.w/v.n,ms:streak[k].m,cs:streak[k].c}));
  const tl=Object.entries(T).map(([k,v])=>({k,...v,r:v.w/v.n}));
  const bp=Object.entries(PR).map(([k,o])=>{const m=best(Object.entries(o).filter(([,v])=>v.n>=2).map(([p,v])=>({p,...v,r:v.w/v.n})),x=>x.r*100+x.n);return m&&{k,...m}}).filter(Boolean);
  const nm=Object.entries(RV).map(([k,o])=>{const m=best(Object.entries(o).filter(([,v])=>v.n>=2).map(([t,v])=>({t,...v,l:v.n-v.w})),x=>x.l*100+x.n);return m&&m.l>0&&{k,...m}}).filter(Boolean);
  return {pl,tl,rec,bp,nm};
}
const pct=r=>Math.round(r*100)+'%';
const fr=(a,b,s)=>`<span style="display:inline-flex;direction:rtl;gap:4px;justify-content:center"><span>${a}</span><span>${s}</span><span>${b}</span></span>`;
const best=(a,f)=>a.length?a.reduce((m,x)=>f(x)>f(m)?x:m):null;

function render(){
  if(loaded.p+loaded.g+loaded.l+loaded.m+loaded.t<5)return;
  const keep={a:($('#ia')||{}).value,b:($('#ib')||{}).value},ke={a:($('#ea')||{}).value,b:($('#eb')||{}).value};
  $('#who').textContent=me?('👤 '+me):'من أنت؟';
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button data-act="tab" data-v="${k}" class="${tab===k?'on':''}">${l}</button>`).join('');
  const m=$('#main');
  if(!me||tab==='who')m.innerHTML=whoView();
  else if(tab==='game')m.innerHTML=live&&live.active&&!(live.finished&&nextSetup)?liveView():setupView();
  else if(tab==='tour')m.innerHTML=tourView();
  else if(tab==='online')m.innerHTML=window.oView?oView():'<div class="card empty">جاري التحميل…</div>';
  else if(tab==='stats')m.innerHTML=statsView();
  else m.innerHTML=histView();
  if($('#ia')&&keep.a!==undefined){$('#ia').value=keep.a;$('#ib').value=keep.b}
  if($('#ea')&&ke.a!==undefined){$('#ea').value=ke.a;$('#eb').value=ke.b}
}

function whoView(){
  return `<div class="card"><h2>من أنت؟</h2><p class="note">اختر اسمك مرة وحدة وبيتذكره جوالك.</p>
  <div class="chips">${players.map(p=>`<button data-act="setme" data-v="${esc(p)}">${esc(p)}</button>`).join('')||'<span class="note">ما فيه لاعبين بعد، أضف اسمك:</span>'}</div>
  <div class="row"><input id="np" placeholder="اسم جديد"><button class="btn" style="flex:0 0 90px" data-act="addme">إضافة</button></div></div>`;
}

function setupView(){
  const opt=v=>`<option value="">— اختر —</option>`+players.map(p=>`<option ${p===v?'selected':''}>${esc(p)}</option>`).join('');
  if(!setup.pre){
    setup.pre=true;
    const lg=[...games].sort((x,y)=>y.ts-x.ts)[0];
    if(nextSetup&&live&&live.finished){const A=live.win==='A';setup.p=[...(A?live.a:live.b),...(A?live.b:live.a)];setup.cont=true}
    else if(lg){const A=lg.winner==='A';setup.p=[...(A?lg.a:lg.b),...(A?lg.b:lg.a)];setup.cont=true}
    else if(me)setup.p[0]=me;
  }
  const sel=i=>`<select data-act="sel" data-i="${i}">${opt(setup.p[i])}</select>`;
  const nx=nextSetup&&live&&live.finished;
  return `<div class="card"><h2>صكة جديدة</h2>${setup.cont?'<p class="note">الفريق الفايز مستمر، غيّر المتحدين لو تبغى</p>':''}
  <div class="team"><label>${setup.cont?'الفريق الفايز (مستمر)':'الفريق الأول'}</label>${sel(0)}${sel(1)}</div>
  <div class="vs">ضد</div>
  <div class="team"><label>${setup.cont?'الفريق المتحدي':'الفريق الثاني'}</label>${sel(2)}${sel(3)}</div>
  <button class="btn gold" data-act="start">ابدأ الصكة</button>
  ${nx?'<button class="btn alt" data-act="back" style="margin-top:8px">رجوع</button>':''}</div>
  <div class="card"><h2>اللاعبين</h2><div class="chips">${players.map(p=>`<span class="who">${esc(p)}</span>`).join('')}</div>
  <div class="row"><input id="np" placeholder="أضف لاعب جديد"><button class="btn alt" style="flex:0 0 90px" data-act="addp">إضافة</button></div></div>`;
}

const tot=o=>{const r=(o&&o.rounds)||[];return [r.reduce((s,x)=>s+x.a,0),r.reduce((s,x)=>s+x.b,0)]};
function board(sa,sb){
  const t=live.target;
  const c=(n,s,l)=>`<div class="cir ${l?'lead':''}" style="--p:${Math.min(100,s/t*100)}%"><div class="in"><b>${s}</b><small>${tn(n)}</small></div></div>`;
  return `<div class="bd">${c(live.a,sa,sa>sb)}${c(live.b,sb,sb>sa)}</div>`;
}
function liveView(){
  const [sa,sb]=sums(),r=live.rounds||[],fin=!!live.finished,own=live.owner===devId;
  const bd=board(sa,sb);
  let mg='';
  if(own){
    if(editTeams){
      const sl=i=>`<select data-act="tsel" data-i="${i}">`+players.map(p=>`<option ${p===tm[i]?'selected':''}>${esc(p)}</option>`).join('')+`</select>`;
      mg=`<div class="card"><h2>تعديل الفريقين</h2><div class="team"><label>لنا</label>${sl(0)}${sl(1)}</div><div class="team"><label>لهم</label>${sl(2)}${sl(3)}</div><div class="row"><button class="btn" data-act="tsave">حفظ</button><button class="btn alt" data-act="tback">رجوع</button></div></div>`;
    }else{
      mg=`<div class="row" style="margin-bottom:12px"><button class="btn alt" data-act="etm">✏️ تعديل الفريقين</button><button class="btn bad" data-act="cancelg">إلغاء الصكة</button></div>`;
    }
  }
  let mid;
  if(fin){
    const w=live.win==='A'?live.a:live.b;
    const nb=live.tour?'<button class="btn gold" data-act="tab" data-v="tour">🏆 رجوع للبطولة</button>':'<button class="btn gold" data-act="next">صكة جديدة، الفايز مستمر</button>';
    mid=`<div class="card" style="text-align:center"><h2>🏆 فاز ${tn(w)}</h2><div class="note">${sa} - ${sb}</div><div class="row" style="margin-top:10px">${own?'<button class="btn alt" data-act="undo">↩ تراجع</button>':''}${nb}</div></div>`;
  }else if(own){

let T=null,tsel=new Set(),swp=null,anim=null,animT=null,actx=null;
const TNAMES=['🦅 الصقور','🐺 الذيابة','🐯 النمور','🦁 الأسود','🐆 الفهود','⚡ الصواعق','🔥 الشعلة','🌪️ الإعصار','🐎 الخيالة','⭐ النجوم','🌙 الهلال','🗡️ السيوف','🐪 الهجن','🦂 العقارب','🌊 الموج','☄️ الشهب'];
const rnd=n=>{try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}catch(e){return Math.floor(Math.random()*n)}};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const strip=s=>String(s).replace(/^\S+\s/,'');
// أول دور: لو عدد الفرق مو من مضاعفات 2، بعض الفرق تتأهل مباشرة (راحة) موزعة على الجدول
function buildFirst(order){
  const n=order.length;let size=1;while(size<n)size*=2;
  const half=size/2,byes=size-n,bm=new Set();for(let k=0;k<byes;k++)bm.add(Math.floor(k*half/byes));
  const f=[];let q=0;
  for(let i=0;i<half;i++)f.push(bm.has(i)?{a:order[q++],b:-1}:{a:order[q++],b:order[q++]});
  return f;
}
function makeDraw(pl){
  const s=shuf(pl),nm=shuf(TNAMES),teams=[];
  for(let i=0;i<s.length;i+=2)teams.push({n:nm[i/2],p:[s[i],s[i+1]]});
  return {teams,first:buildFirst(shuf(teams.map((_,i)=>i)))};
}
// -1 = راحة ، -2 = بانتظار الفايز
function bracket(t){
  const R=[];let cur=t.first.map(x=>({a:x.a,b:x.b})),r=0,no=0;const res=t.res||{};
  for(;;){
    cur.forEach((m,i)=>{
      m.k='m'+r+'_'+i;m.r=r;m.i=i;m.w=null;m.bye=false;
      if(m.a>=0&&m.b===-1){m.w=m.a;m.bye=true}
      else{
        if(m.a>=0&&m.b>=0){m.no=++no;const x=res[m.k];if(x&&(x.w===m.a||x.w===m.b)){m.w=x.w;m.x=x.x;m.y=x.y}}
      }
    });
    R.push(cur);if(cur.length===1)break;
    const nx=[];for(let i=0;i<cur.length;i+=2)nx.push({a:cur[i].w??-2,b:cur[i+1].w??-2});
    cur=nx;r++;
  }
  return R;
}
function rname(r,t=T){const n=t.first.length*2/Math.pow(2,r);return n<=2?'النهائي':n===4?'نصف النهائي':n===8?'ربع النهائي':'دور الـ'+n}
const champOf=R=>{const f=R[R.length-1][0];return f.w!=null&&f.w>=0?f.w:null};

function tone(f,d,type,v,at){if(!snd)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime+(at||0),o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const tick=()=>tone(900+rnd(500),.035,'square',.02);
const boom=()=>{tone(110,.4,'triangle',.3);tone(220,.3,'sine',.12)};
const fanfare=()=>[523,659,784,1047].forEach((f,i)=>tone(f,i===3?.8:.18,'triangle',.13,i*.15));
function confetti(){
  try{const c=document.createElement('canvas'),d=devicePixelRatio||1;c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99';document.body.appendChild(c);
  const x=c.getContext('2d'),W=c.width=innerWidth*d,H=c.height=innerHeight*d,cols=['#e0b84a','#2e8b5b','#ffffff','#b3392f','#3fae75'];
  const ps=Array.from({length:170},()=>({x:Math.random()*W,y:-Math.random()*H*.6,vx:(Math.random()-.5)*4*d,vy:(2+Math.random()*5)*d,s:(5+Math.random()*7)*d,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[rnd(cols.length)]}));
  const t0=Date.now();(function f(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});Date.now()-t0<4500?requestAnimationFrame(f):c.remove()})()}catch(e){}
}

async function tourSetResult(k,w,x,y,tid){
  if(!T||!T.first||(tid&&T.tid!==tid))return;
  const res={...(T.res||{})};
  if(w==null)delete res[k];else res[k]={w,x:x??null,y:y??null};
  const R=bracket({...T,res}),ok=new Set();R.flat().forEach(m=>{if(!m.bye&&m.w!=null)ok.add(m.k)});
  Object.keys(res).forEach(kk=>{if(!ok.has(kk))delete res[kk]});
  await updT({res,stage:champOf(R)!=null?'done':'locked'});
}
function announce(p,n){
  if(!p||!n||p.tid!==n.tid||!n.first)return;
  const o=p.res||{},r=n.res||{},k=Object.keys(r).find(k=>!o[k]||o[k].w!==r[k].w);if(!k)return;
  const R=bracket(n),c=champOf(R),t=n.teams[r[k].w];
  setTimeout(()=>{
    if(c!=null&&R[R.length-1][0].k===k){fanfare();confetti();speak('مبروك للأبطال، '+strip(t.n)+'، '+t.p.join(' و '))}
    else{boom();speak('تأهل '+strip(t.n)+' إلى '+rname(parseInt(k.slice(1))+1,n))}
  },2200);
}

function tourSetup(){
  const n=tsel.size,ok=n>=4&&n%2===0&&n<=32;
  const info=!n?'اختر المشاركين':n%2?`${n} لاعبين — لازم العدد يكون زوجي`:n>32?'الحد الأعلى 32 لاعب':n<4?'يحتاج 4 لاعبين على الأقل':`${n} لاعبين = ${n/2} فرق · ${Math.ceil(Math.log2(n/2))} أدوار`;
  return `<div class="card"><h2>🏆 بطولة جديدة</h2><p class="note">اختر المشاركين، والقرعة تقسمهم فرق وتحدد المواجهات.</p>
  <div class="chips">${players.map(p=>`<button class="${tsel.has(p)?'on':''}" data-act="tpick" data-v="${esc(p)}">${esc(p)}</button>`).join('')||'<span class="note">ما فيه لاعبين بعد</span>'}</div>
  <button class="btn alt" data-act="tall" style="margin-bottom:10px">${players.length&&tsel.size===players.length?'إلغاء الكل':'اختيار الكل'}</button>
  <p class="note" style="text-align:center;font-weight:700">${info}</p>
  <button class="btn gold" data-act="tdraw" ${ok?'':'disabled'}>🎲 سوّ القرعة</button></div>
  <div class="card"><h2>لاعب جديد</h2><div class="row"><input id="np" placeholder="اسم اللاعب"><button class="btn alt" style="flex:0 0 90px" data-act="taddp">إضافة</button></div></div>`;
}
function mrow(m,t,side,click){
  const st=m.w==null||m.bye?'':(m.w===t?'w':'l');
  const nm=t>=0?esc(T.teams[t].n):'بانتظار الفايز';
  const ps=t>=0?`<span class="tp2">${tn(T.teams[t].p)}</span>`:'';
  const sc=m.w!=null&&!m.bye?(side==='a'?m.x:m.y):null;
  const inner=`<span><span class="tn2">${nm}</span>${ps}</span>${sc!=null?`<b>${sc}</b>`:''}`;
  return click?`<button class="mt ${st}" data-act="tw" data-k="${m.k}" data-v="${t}">${inner}</button>`:`<div class="mt ${st} ${t<0?'tbd':''}">${inner}</div>`;
}
function bracketHtml(R,own,nx){
  return R.map((rd,r)=>`<div class="rh">${r===R.length-1?'🏆 ':''}${rname(r)}</div>`+rd.map(m=>{
    if(m.bye)return `<div class="mc"><div class="mh"><span>تأهل مباشر (راحة)</span></div>${mrow(m,m.a,'a',false)}</div>`;
    const ck=own&&T.stage!=='drawn'&&m.a>=0&&m.b>=0;
    return `<div class="mc ${nx&&nx.k===m.k?'nx':''}"><div class="mh"><span>${m.no?'المباراة '+m.no:''}</span><span>${nx&&nx.k===m.k?'🔥 القادمة':''}</span></div>${mrow(m,m.a,'a',ck)}${mrow(m,m.b,'b',ck)}</div>`;
  }).join('')).join('');
}
function tourView(){
  if(!T||!T.teams||T.stage==='none')return tourSetup();
  const own=T.owner===devId,R=bracket(T);
  const org=`<p class="note" style="text-align:center">المنظم: ${esc(T.by||'—')}${own?' (أنت)':''}</p>`;
  const take=own?'':`<button class="btn alt" data-act="ttake" style="margin-top:8px">أنا المنظم (التحكم من هذا الجهاز)</button>`;
  if(T.stage==='drawn'){
    const tcs=T.teams.map((t,i)=>{
      if(anim&&i>anim.n)return `<div class="tc hid"><div class="tn3">🂠</div><div class="sp">؟</div></div>`;
      if(anim&&i===anim.n)return `<div class="tc spin"><div class="tn3">🎲 الفريق ${i+1}</div><div class="sp" id="spin">…</div></div>`;
      return `<div class="tc ${anim&&i===anim.n-1?'pop':''}"><div class="tn3">${esc(t.n)}</div>${t.p.map((p,j)=>`<button ${own&&!anim?`data-act="tsw" data-t="${i}" data-j="${j}"`:'disabled'} class="${swp&&swp[0]===i&&swp[1]===j?'sw':''}">${esc(p)}</button>`).join('')}</div>`;
    }).join('');
    if(anim)return `<div class="card"><h2>🎲 القرعة جارية…</h2><div class="tg">${tcs}</div><button class="btn alt" data-act="tskip" style="margin-top:10px">تخطي ⏭</button></div>`;
    return `<div class="card"><h2>🎲 نتيجة القرعة</h2>${own?'<p class="note">تبغى تغيّر؟ اضغط على لاعبين وبيتبادلون أماكنهم.</p>':''}<div class="tg">${tcs}</div>
    ${own?`<div class="row" style="margin-top:12px"><button class="btn alt" data-act="tredraw">🎲 أعد القرعة</button><button class="btn alt" data-act="tmix">🔀 غيّر المواجهات</button></div>
    <button class="btn gold" data-act="tlock" style="margin-top:8px">✅ اعتمد القرعة وابدأ البطولة</button>
    <button class="btn bad" data-act="tnew" style="margin-top:8px">إلغاء البطولة</button>`:take}${org}</div>
    <div class="card"><h2>المواجهات</h2>${bracketHtml(R,false,null)}</div>`;
  }
  const c=champOf(R);let top='';
  const all=R.flat().filter(m=>!m.bye),left=all.filter(m=>m.w==null).length;
  if(c!=null){const t=T.teams[c];top=`<div class="champ"><div class="cup">🏆</div><div class="note" style="color:#1b1500">أبطال البطولة</div><div class="nm">${esc(t.n)}</div><div style="font-weight:700;margin-top:4px">${tn(t.p)}</div></div>`}
  const nx=all.find(m=>m.a>=0&&m.b>=0&&m.w==null);
  if(nx){
    const A=T.teams[nx.a],B=T.teams[nx.b],first=!Object.keys(T.res||{}).length;
    const running=live&&live.active&&!live.finished&&live.tour&&live.tour.tid===T.tid&&live.tour.k===nx.k;
    top=`<div class="hero"><span class="tag">${first?'🎬 مباراة الافتتاح':nx.r===R.length-1?'👑 المباراة النهائية':'🔥 المباراة القادمة'}</span>
    <div class="rnd">${rname(nx.r)} · المباراة ${nx.no}</div>
    <div class="duel"><div class="side"><div class="nm">${esc(A.n)}</div><div class="ps">${tn(A.p)}</div></div><div class="x">VS</div><div class="side"><div class="nm">${esc(B.n)}</div><div class="ps">${tn(B.p)}</div></div></div>
    ${running?'<button class="btn gold" data-act="tab" data-v="game" style="margin-top:14px">🃏 الصكة شغالة، تابعها</button>':own?`<button class="btn gold" data-act="tplay" data-k="${nx.k}" style="margin-top:14px">▶️ ابدأ الصكة</button>`:''}
    <p class="note" style="margin-top:8px">باقي ${left} ${left===1?'مباراة':'مباريات'}${own?' · أو اضغط على الفريق الفايز تحت لتسجيله يدوي':''}</p></div>`;
  }
  return `${top}<div class="card"><h2>جدول البطولة</h2>${bracketHtml(R,own,nx)}</div>
  <div class="card">${own||c!=null?`<div class="row"><button class="btn alt" data-act="tredraw">🎲 قرعة جديدة</button><button class="btn ${c!=null?'gold':'bad'}" data-act="tnew">${c!=null?'🏆 بطولة جديدة':'إنهاء البطولة'}</button></div>`:''}${take}${org}</div>`;
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v,own=T&&T.owner===devId;
  if(a==='tpick'){tsel.has(v)?tsel.delete(v):tsel.add(v);render()}
  else if(a==='tall'){tsel=tsel.size===players.length?new Set():new Set(players);render()}
  else if(a==='taddp'){const n=await addPlayer($('#np').value);if(n){tsel.add(n);$('#np').value='';render()}}
  else if(a==='tdraw'){
    const pl=[...tsel].filter(p=>players.includes(p));
    if(pl.length<4||pl.length%2||pl.length>32)return alert('اختر عدد زوجي من 4 إلى 32 لاعب');
    if(T&&T.teams&&T.stage!=='none'&&T.stage!=='done'&&!confirm('فيه بطولة قائمة، تبغى تستبدلها؟'))return;
    const d=makeDraw(pl),now=Date.now();
    await saveT({tid:now,drawId:now,stage:'drawn',owner:devId,by:me||'',players:pl,teams:d.teams,first:d.first,res:{},ts:now});
  }
  else if(a==='tskip'){anim=null;clearInterval(animT);render()}
  else if(!T||!T.teams)return;
  else if(a==='ttake'){if(confirm('تتحكم بالبطولة من هذا الجهاز؟'))await updT({owner:devId,by:me||''})}
  else if(!own&&a!=='tnew')return;
  else if(a==='tsw'){
    if(T.stage!=='drawn')return;
    const t=+b.dataset.t,j=+b.dataset.j;
    if(!swp){swp=[t,j];return render()}
    if(swp[0]===t&&swp[1]===j){swp=null;return render()}
    const tm2=T.teams.map(x=>({n:x.n,p:[...x.p]})),[t0,j0]=swp;
    [tm2[t0].p[j0],tm2[t].p[j]]=[tm2[t].p[j],tm2[t0].p[j0]];swp=null;
    await updT({teams:tm2});
  }
  else if(a==='tmix'){if(T.stage!=='drawn')return;await updT({first:buildFirst(shuf(T.teams.map((_,i)=>i))),res:{}});tick();boom()}
  else if(a==='tredraw'){
    if(Object.keys(T.res||{}).length&&!confirm('قرعة جديدة بتمسح نتايج البطولة، متأكد؟'))return;
    const d=makeDraw(T.players),now=Date.now();
    await saveT({...T,tid:now,drawId:now,stage:'drawn',owner:devId,teams:d.teams,first:d.first,res:{}});
  }
  else if(a==='tlock'){await updT({stage:'locked'});fanfare();speak('بسم الله، انطلقت البطولة')}
  else if(a==='tnew'){
    if(T.stage!=='done'&&!own)return;
    if(T.stage!=='done'&&!confirm('تبغى تنهي البطولة الحالية؟'))return;
    tsel=new Set((T.players||[]).filter(p=>players.includes(p)));
    await saveT({stage:'none'});
  }
  else if(a==='tw'){
    const k=b.dataset.k,t=+v,m=bracket(T).flat().find(x=>x.k===k);if(!m)return;
    if(m.w===t){if(confirm('تلغي نتيجة هذي المباراة؟'))await tourSetResult(k,null)}
    else if(confirm('فوز '+strip(T.teams[t].n)+'؟'+(m.w!=null?' (بيتغير الفايز وتنمسح النتايج اللي بعدها)':'')))await tourSetResult(k,t,null,null);
  }
  else if(a==='tplay'){
    const m=bracket(T).flat().find(x=>x.k===b.dataset.k);if(!m||m.a<0||m.b<0)return;
    if(live&&live.active&&!live.finished&&!confirm('فيه صكة شغالة، تبغى تلغيها وتبدأ مباراة البطولة؟'))return;
    editIdx=-1;nextSetup=false;editTeams=false;
    await saveLive({active:true,finished:false,gid:Date.now(),owner:devId,a:[...T.teams[m.a].p],b:[...T.teams[m.b].p],target:152,rounds:[],gameId:null,win:null,tour:{tid:T.tid,k:m.k,ta:m.a,tb:m.b}});
    tab='game';render();speak(strip(T.teams[m.a].n)+' ضد '+strip(T.teams[m.b].n)+'، بالتوفيق');
  }
});

db.doc('live/current').onSnapshot(s=>{
  const nl=s.exists?s.data():null;
  if(loaded.l&&nl&&live&&nl.gid===live.gid){
    const n0=(live.rounds||[]).length,n1=(nl.rounds||[]).length;
    if(nl.finished&&!live.finished){const [x,y]=tot(nl);speak(nl.win==='A'?'مبروك، الصكة لنا، '+n2w(x)+' مقابل '+n2w(y):'الصكة لهم، '+n2w(y)+' مقابل '+n2w(x))}
    else if(n1>n0&&!nl.finished)speak(say(nl));
  }
  if(!(nl&&nl.finished&&live&&nl.gid===live.gid))nextSetup=false;
  if(!nl||!nl.active)editTeams=false;
  live=nl;loaded.l=1;render();
},err);
db.doc('live/tourney').onSnapshot(s=>{
  const nT=s.exists?s.data():null,pT=T;T=nT;
  if(pT&&nT&&pT.tid!==nT.tid)swp=null;
  if(!nT||nT.stage!=='drawn'){if(anim){anim=null;clearInterval(animT)}}
  if(loaded.t&&nT){
    if(nT.stage==='drawn'&&nT.drawId&&(!pT||pT.drawId!==nT.drawId)){if(tab!=='tour'&&me&&!(live&&live.active&&!live.finished&&live.owner===devId))tab='tour';loaded.t=1;return runAnim()}
    announce(pT,nT);
  }
  loaded.t=1;render();
},e=>{console.error(e);T=null;loaded.t=1;render()});
